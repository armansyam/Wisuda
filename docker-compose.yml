version: '3.8'

services:
  wisuda-api:
    build: .
    container_name: wisuda-api
    restart: always
    ports:
      - "8081:8081"
    volumes:
      - ./DATA:/app/DATA
      - .env:/app/.env
      - ./logs:/app/logs
    environment:
      - NODE_ENV=production

  wisuda-cron:
    build: .
    container_name: wisuda-cron
    restart: always
    command: npm run cron
    volumes:
      - ./DATA:/app/DATA
      - .env:/app/.env
      - ./logs:/app/logs
    depends_on:
      - wisuda-api
