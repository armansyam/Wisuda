version: '3.8'

services:
  wisuda-api:
    build: .
    container_name: wisuda-api
    restart: always
    ports:
      - "8081:8081"
    volumes:
      - ./DATA:/app/DATA
      - ./logs:/app/logs
      - ./.env:/app/.env
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - TZ=${TZ:-Asia/Makassar}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:8081}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  wisuda-cron:
    build: .
    container_name: wisuda-cron
    restart: always
    command: npm run cron
    volumes:
      - ./DATA:/app/DATA
      - ./logs:/app/logs
      - ./.env:/app/.env
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - TZ=${TZ:-Asia/Makassar}
    depends_on:
      wisuda-api:
        condition: service_healthy
