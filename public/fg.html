<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FG Portal — Fotografer Wisuda</title>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.15.x/dist/cdn.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300..700&display=swap" rel="stylesheet">
  <style>
    :root { --cream: #FAF6F0; --sage: #C5A880; --peach: #F5EBE0; --lavender: #E8D8C8; --neon-lime: #D4AF37; --ink: #111E35; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--ink); }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes slideIn { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: translateX(0); } }
    .animate-fade-up { animation: fadeUp 0.4s ease-out both; }
    .animate-slide-in { animation: slideIn 0.3s ease-out both; }
    .loading-spinner { border: 3px solid #E8E4D8; border-top: 3px solid #D4AF37; border-radius: 50%; width: 28px; height: 28px; animation: spin 1s linear infinite; display: inline-block; }
    .bg-noise { background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E"); }
    .card { border-radius: 20px; background: white; border: 1.5px solid #E8E4D8; box-shadow: 0 2px 12px rgba(0,0,0,0.03); }
    .input-fancy { border: 1.5px solid #E8E4D8; border-radius: 14px; padding: 14px 16px; font-size: 15px; background: white; transition: border 0.2s; width: 100%; }
    .input-fancy:focus { outline: none; border-color: var(--sage); box-shadow: 0 0 0 4px rgba(139,168,139,0.15); }
    .film-card { border-radius: 16px; overflow: hidden; background: white; border: 1.5px solid #E8E4D8; transition: all 0.2s; }
    .film-card:hover { border-color: var(--sage); box-shadow: 0 4px 16px rgba(139,168,139,0.12); }
    .film-strip { background: repeating-linear-gradient(90deg, transparent, transparent 24px, #E8E4D8 24px, #E8E4D8 25px); }
    .status-chip { border-radius: 100px; padding: 4px 10px; font-size: 9px; font-weight: 600; display: inline-flex; align-items: center; gap: 3px; }
    .nav-tab { padding: 10px 18px; border-radius: 14px; font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.2s; background: transparent; color: #4A4A5A; border: 1.5px solid transparent; }
    .nav-tab.active { background: var(--ink); color: var(--neon-lime); border-color: var(--ink); }
    .nav-tab:hover:not(.active) { background: #E8E4D8/60; }
    .scroll-hide::-webkit-scrollbar { display: none; }
    .scroll-hide { -ms-overflow-style: none; scrollbar-width: none; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; } }
  </style>
</head>
<body class="min-h-screen bg-noise">
  <div x-data="fgPortalApp()" x-init="init()" class="pb-20">
    <!-- Login Screen -->
    <div x-show="!token" class="min-h-screen flex items-center justify-center p-5">
      <div class="w-full max-w-sm animate-fade-up">
        <div class="text-center mb-6">
          <div class="w-12 h-12 rounded-2xl bg-[#111E35] flex items-center justify-center mx-auto mb-4 text-lg text-[#D4AF37] font-bold">FG</div>
          <h1 class="text-xl font-bold text-[#111E35]">Portal <span class="text-[#C5A880]">FG</span></h1>
          <p class="text-sm text-[#4A4A5A]/60 mt-1">Masuk pake kode kamu ya 👋</p>
        </div>
        <div class="card p-5 space-y-3">
          <div>
            <label class="text-xs text-[#4A4A5A]/60 mb-1.5 block">Kode Akses</label>
            <input x-model="loginCode" type="password" @keydown.enter="login()" class="input-fancy" placeholder="Masukin kode...">
          </div>
          <div x-show="loginError" class="text-xs text-red-500 bg-red-50 rounded-xl px-3 py-2 border border-red-200" x-text="loginError"></div>
          <button @click="login()" :disabled="!loginCode.trim() || loading"
            class="w-full px-5 py-3 bg-[#111E35] text-[#D4AF37] rounded-xl text-xs font-semibold disabled:opacity-40 hover:bg-[#1C3B6F] transition flex items-center justify-center gap-2">
            <span x-show="!loading">Masuk →</span>
            <span x-show="loading" class="loading-spinner !w-4 !h-4"></span>
          </button>
        </div>
        <p class="text-center text-[10px] text-[#4A4A5A]/40 mt-4">Fotografer · Wisuda Photography 📸</p>
      </div>
    </div>

    <!-- Dashboard -->
    <div x-show="token" x-cloak>
      <!-- Top bar -->
      <div class="sticky top-0 z-40 bg-[#FAF6F0]/90 backdrop-blur-lg border-b border-[#E8E4D8]/60">
        <div class="max-w-5xl mx-auto px-5 h-14 flex items-center justify-between">
          <div class="flex items-center gap-2">
            <span class="w-6 h-6 rounded-md bg-[#111E35] flex items-center justify-center text-[8px] font-bold text-[#D4AF37]">FG</span>
            <span class="text-xs font-semibold">Dashboard</span>
          </div>
          <div class="flex items-center gap-2">
            <span class="text-[10px] text-[#4A4A5A]/60 hidden md:inline" x-text="fgName"></span>
            <button @click="logout()" class="text-[10px] text-red-400 hover:text-red-500 px-2.5 py-1 rounded-lg hover:bg-red-50">Logout</button>
          </div>
        </div>
      </div>

      <!-- Tabs -->
      <div class="max-w-5xl mx-auto px-5 pt-4 pb-3 overflow-x-auto scroll-hide">
        <div class="flex gap-2 min-w-max">
          <button @click="tab='assignments'" class="nav-tab" :class="tab==='assignments'?'active':''">📸 Tugas FG</button>
          <button @click="tab='upload'" class="nav-tab" :class="tab==='upload'?'active':''">📤 Upload</button>
          <button @click="tab='history'" class="nav-tab" :class="tab==='history'?'active':''">📖 Riwayat</button>
        </div>
      </div>

      <!-- Loading -->
      <div class="flex justify-center py-16" x-show="loading">
        <div class="loading-spinner"></div>
      </div>

      <!-- === TAB: Assignments === -->
      <div x-show="tab==='assignments' && !loading" class="max-w-5xl mx-auto px-5 animate-fade-up">
        <div class="flex items-center justify-between mb-4">
          <h2 class="font-bold text-[#111E35] text-lg">Tugas <span class="text-[#C5A880]">FG</span></h2>
          <span class="text-[10px] text-[#4A4A5A]/60" x-text="assignments.length + ' tugas'"></span>
        </div>
        
        <!-- Film Strip Layout -->
        <div class="space-y-3" x-show="assignments.length > 0">
          <template x-for="(a, i) in assignments" :key="a.id">
            <div class="film-card p-4 animate-slide-in" :style="{ animationDelay: (i*30)+'ms' }">
              <div class="flex items-start gap-3">
                <!-- Film roll icon -->
                <div class="w-10 h-10 rounded-xl bg-[#E8D8C8]/20 flex items-center justify-center flex-shrink-0 text-sm">🎞️</div>
                <div class="flex-1 min-w-0">
                  <div class="flex items-center gap-2 mb-1">
                    <span class="font-semibold text-sm text-[#111E35]" x-text="a.client_name"></span>
                    <span class="status-chip" :class="statusColor(a.status)" x-text="a.status_label"></span>
                  </div>
                  <p class="text-xs text-[#4A4A5A]/70" x-text="a.university + ' · ' + a.package_name"></p>
                  <div class="flex items-center gap-3 mt-2 text-[10px] text-[#4A4A5A]/60">
                    <span>📅 <span x-text="a.graduation_date"></span></span>
                    <span x-show="a.location">📍 <span x-text="a.location"></span></span>
                  </div>
                  <div class="flex gap-1.5 mt-2" x-show="a.notes">
                    <span class="text-[10px] text-[#4A4A5A]/50 italic" x-text="'📝 '+a.notes"></span>
                  </div>
                  <!-- Actions -->
                  <div class="flex gap-2 mt-3 pt-2 border-t border-[#E8E4D8]/60">
                    <button @click="startUpload(a)" class="text-[10px] px-3 py-1.5 bg-[#D4AF37]/20 text-[#111E35] rounded-xl font-medium hover:bg-[#D4AF37]/30 transition flex items-center gap-1">
                      📤 Upload
                    </button>
                    <button @click="markDone(a)" x-show="a.status !== 'done' && a.status !== 'completed'" class="text-[10px] px-3 py-1.5 bg-[#C5A880]/20 text-[#C5A880] rounded-xl font-medium hover:bg-[#C5A880]/30 transition">
                      ✅ Selesai
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </template>
        </div>
        <div class="text-center py-12" x-show="assignments.length === 0">
          <div class="text-4xl mb-3 opacity-30">🎞️</div>
          <p class="text-sm text-[#4A4A5A]/60">Belum ada tugas FG — istirahat dlu 😎</p>
        </div>
      </div>

      <!-- === TAB: Upload === -->
      <div x-show="tab==='upload' && !loading" class="max-w-5xl mx-auto px-5 animate-fade-up">
        <div class="card p-5">
          <h2 class="font-bold mb-1">📤 Upload Hasil</h2>
          <p class="text-xs text-[#4A4A5A]/60 mb-4">Pilih tugas & upload foto hasil jepretan</p>
          <div class="space-y-3">
            <div>
              <label class="text-xs text-[#4A4A5A]/60 mb-1 block">Pilih Client</label>
              <select x-model="uploadBookingId" class="input-fancy">
                <option value="">-- Pilih --</option>
                <template x-for="a in assignments" :key="a.id">
                  <option :value="a.id" x-text="a.client_name+' — '+a.university"></option>
                </template>
              </select>
            </div>
            <div x-show="uploadBookingId">
              <label class="text-xs text-[#4A4A5A]/60 mb-1 block">Highlight Photos (max 5)</label>
              <input type="file" multiple accept="image/*" @change="handleFileSelect" class="w-full text-xs text-[#4A4A5A]/60 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:bg-[#111E35] file:text-[#D4AF37] file:text-xs file:font-semibold hover:file:bg-[#1C3B6F]">
              <div class="flex flex-wrap gap-2 mt-2" x-show="uploadPreview.length">
                <template x-for="(p, i) in uploadPreview" :key="i">
                  <div class="relative">
                    <img :src="p" class="w-16 h-16 object-cover rounded-xl border border-[#E8E4D8]">
                    <button @click="removePreview(i)" class="absolute -top-1.5 -right-1.5 w-5 h-5 bg-red-500 text-white rounded-full text-[9px] font-bold flex items-center justify-center">×</button>
                  </div>
                </template>
              </div>
            </div>
            <div x-show="uploadError" class="text-xs text-red-500 bg-red-50 rounded-xl px-3 py-2 border border-red-200" x-text="uploadError"></div>
            <div x-show="uploadSuccess" class="text-xs text-green-600 bg-green-50 rounded-xl px-3 py-2 border border-green-200" x-text="uploadSuccess"></div>
            <button @click="submitUpload()" :disabled="!uploadBookingId || uploadFiles.length === 0 || uploading"
              class="w-full px-5 py-3 bg-[#111E35] text-[#D4AF37] rounded-xl text-xs font-semibold disabled:opacity-40 hover:bg-[#1C3B6F] transition flex items-center justify-center gap-2">
              <span x-show="!uploading">Upload 📤</span>
              <span x-show="uploading" class="flex items-center gap-2"><span class="loading-spinner !w-4 !h-4"></span> Ngirim...</span>
            </button>
          </div>
        </div>
      </div>

      <!-- === TAB: History === -->
      <div x-show="tab==='history' && !loading" class="max-w-5xl mx-auto px-5 animate-fade-up">
        <h2 class="font-bold text-lg mb-4 text-[#111E35]">📖 Riwayat</h2>
        <div class="space-y-3" x-show="history.length > 0">
          <template x-for="(h, i) in history" :key="h.id">
            <div class="film-card p-4 animate-slide-in" :style="{ animationDelay: (i*30)+'ms' }">
              <div class="flex items-start gap-3">
                <div class="w-10 h-10 rounded-xl bg-[#D4AF37]/20 flex items-center justify-center flex-shrink-0 text-sm">✅</div>
                <div class="flex-1">
                  <p class="font-semibold text-sm" x-text="h.client_name"></p>
                  <p class="text-xs text-[#4A4A5A]/70" x-text="h.university"></p>
                  <p class="text-[10px] text-[#4A4A5A]/50 mt-1" x-text="h.updated_at_formatted"></p>
                </div>
                <span class="text-[10px] text-[#C5A880]">✅ Done</span>
              </div>
            </div>
          </template>
        </div>
        <div class="text-center py-12" x-show="history.length === 0">
          <div class="text-4xl mb-3 opacity-30">📖</div>
          <p class="text-sm text-[#4A4A5A]/60">Belum ada riwayat selesai</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    function fgPortalApp() {
      return {
        token: '', fgName: '', tab: 'assignments',
        loading: false, loginCode: '', loginError: '',
        assignments: [], history: [],
        uploadBookingId: '', uploadFiles: [], uploadPreview: [], uploading: false,
        uploadError: '', uploadSuccess: '',

        statusColor(s) {
          if (s === 'pending') return 'bg-[#E8D8C8]/30 text-[#4A4A5A]'
          if (s === 'assigned') return 'bg-[#C5A880]/20 text-[#C5A880]'
          if (s === 'done' || s === 'completed') return 'bg-[#D4AF37]/20 text-[#8A7333]'
          return 'bg-gray-100 text-gray-500'
        },

        async init() {
          const t = localStorage.getItem('fg_token')
          if (t) { this.token = t; await this.loadDashboard() }
        },

        async login() {
          this.loading = true; this.loginError = ''
          try {
            const res = await fetch('/api/fg/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ code: this.loginCode })
            })
            const data = await res.json()
            if (!res.ok) { this.loginError = data.error || 'Kode salah'; this.loading = false; return }
            this.token = data.token
            this.fgName = data.fg_name || 'FG'
            localStorage.setItem('fg_token', this.token)
            await this.loadDashboard()
          } catch(e) { this.loginError = 'Error login 😅'; console.error(e) }
          this.loading = false
        },

        async loadDashboard() {
          this.loading = true
          try {
            const headers = { 'Authorization': 'Bearer ' + this.token }
            let aRes = await fetch('/api/fg/assignments', { headers })
            if (aRes.ok) this.assignments = await aRes.json()
            let hRes = await fetch('/api/fg/history', { headers })
            if (hRes.ok) this.history = await hRes.json()
          } catch(e) { console.error('Dashboard:', e) }
          this.loading = false
        },

        startUpload(a) { this.uploadBookingId = a.id; this.tab = 'upload' },
        handleFileSelect(e) {
          const files = Array.from(e.target.files).slice(0, 5)
          this.uploadFiles = files
          this.uploadPreview = files.map(f => URL.createObjectURL(f))
        },
        removePreview(i) {
          this.uploadFiles.splice(i, 1)
          this.uploadPreview.splice(i, 1)
        },
        async submitUpload() {
          if (!this.uploadBookingId || this.uploadFiles.length === 0) return
          this.uploading = true; this.uploadError = ''; this.uploadSuccess = ''
          try {
            const fd = new FormData()
            fd.append('booking_id', this.uploadBookingId)
            this.uploadFiles.forEach(f => fd.append('photos', f))
            const res = await fetch('/api/fg/upload', {
              method: 'POST',
              headers: { 'Authorization': 'Bearer ' + this.token },
              body: fd
            })
            const data = await res.json()
            if (!res.ok) { this.uploadError = data.error || 'Gagal upload'; this.uploading = false; return }
            this.uploadSuccess = 'Upload sukses! 🎉'
            setTimeout(() => { this.uploadBookingId = ''; this.uploadFiles = []; this.uploadPreview = []; this.uploadSuccess = ''; this.loadDashboard() }, 2000)
          } catch(e) { this.uploadError = 'Gagal upload 😅'; console.error(e) }
          this.uploading = false
        },

        async markDone(a) {
          if (!confirm('Tandain selesai: ' + a.client_name + '?')) return
          try {
            const res = await fetch('/api/fg/assignments/' + a.id + '/done', {
              method: 'PATCH',
              headers: { 'Authorization': 'Bearer ' + this.token, 'Content-Type': 'application/json' }
            })
            if (!res.ok) { alert('Gagal update'); return }
            await this.loadDashboard()
          } catch(e) { console.error(e) }
        },

        logout() {
          localStorage.removeItem('fg_token')
          this.token = ''
          this.assignments = []
          this.history = []
        }
      }
    }
  </script>
</body>
</html>
