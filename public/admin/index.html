<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wisuda Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="/admin/assets/index-CWa4Q5wG.js"></script>
  <link rel="stylesheet" crossorigin href="/admin/assets/index-lMmn-5Ni.css">
</head>
<body class="bg-[#0f0f0f]">
  <div id="app"></div>
  <!-- Developer Watermark -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    #app {
      width: 100%;
      height: 100%;
    }
    .dev-watermark-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 48px;
      height: 48px;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 9999;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      border: none;
    }
    .dev-watermark-btn:hover {
      transform: scale(1.1) rotate(5deg);
    }
    .dev-watermark-btn:active {
      transform: scale(0.95);
    }
    .dev-watermark-popup {
      position: fixed;
      bottom: 84px;
      right: 24px;
      width: 320px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      z-index: 9998;
      animation: slideUpFade 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      display: none;
      flex-direction: column;
      gap: 14px;
      font-family: 'Inter', sans-serif;
    }
    @keyframes slideUpFade {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    .dev-watermark-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: #0f766e;
      background: #f0fdfa;
      padding: 4px 10px;
      border-radius: 99px;
      width: -moz-fit-content;
      width: fit-content;
      border: 1px solid #ccfbf1;
      font-weight: 600;
    }
    .dev-watermark-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #14b8a6;
      box-shadow: 0 0 8px #14b8a6;
      animation: pulseGlow 2s infinite;
    }
    @keyframes pulseGlow {
      0% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 12px #14b8a6; }
      100% { transform: scale(1); opacity: 0.6; }
    }
  </style>

  <div 
    class="dev-watermark-btn" 
    id="dev-watermark-btn"
    title="Developer Info"
  >
    <img 
      src="/ams-logo.png" 
      alt="AMS Logo" 
      style="width: 38px; height: 38px; object-fit: contain;" 
    />
  </div>

  <div class="dev-watermark-popup" id="dev-watermark-popup">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <span style="font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #64748b; font-weight: 700; text-align: left;">Developer Credit</span>
      <div class="dev-watermark-status">
        <span class="dev-watermark-dot"></span>
        <span>Active Release</span>
      </div>
    </div>
    <div style="text-align: left;">
      <img 
        src="/ams-logo.png" 
        alt="AMS Logo" 
        style="height: 36px; object-fit: contain; margin-bottom: 8px; display: block;" 
      />
      <p style="margin: 0; font-size: 12px; color: #64748b; line-height: 1.4; text-align: left;">
        Designed, built, and optimized with Node.js, Express, and custom styling.
      </p>
    </div>
    <div style="border-top: 1px solid rgba(0,0,0,0.06); padding-top: 12px; display: flex; justify-content: space-between; align-items: center; font-size: 12px;">
      <span style="color: #64748b;">System Version</span>
      <strong style="color: #1e293b;">v1.1.0</strong>
    </div>
    <div style="display: flex; gap: 8px; margin-top: 4px;">
      <a 
        href="https://github.com/armansyam"
        target="_blank" 
        rel="noopener noreferrer"
        style="
          flex: 1;
          text-align: center;
          background: #0f766e;
          color: white;
          padding: 8px 0;
          border-radius: 8px;
          font-size: 12px;
          font-weight: 600;
          text-decoration: none;
          box-shadow: 0 2px 8px rgba(15, 118, 110, 0.2);
        "
      >
        GitHub Profile
      </a>
      <button 
        id="dev-watermark-close"
        style="
          padding: 8px 12px;
          border: 1px solid #e2e8f0;
          border-radius: 8px;
          background: white;
          color: #64748b;
          font-size: 12px;
          cursor: pointer;
          font-weight: 600;
        "
      >
        Tutup
      </button>
    </div>
  </div>

  <script>
    (function() {
      const btn = document.getElementById('dev-watermark-btn');
      const popup = document.getElementById('dev-watermark-popup');
      const closeBtn = document.getElementById('dev-watermark-close');
      
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        if (popup.style.display === 'flex') {
          popup.style.display = 'none';
        } else {
          popup.style.display = 'flex';
        }
      });
      
      closeBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        popup.style.display = 'none';
      });
      
      document.addEventListener('click', function(e) {
        if (!popup.contains(e.target) && e.target !== btn && !btn.contains(e.target)) {
          popup.style.display = 'none';
        }
      });
    })();
  </script>
</body>
</html>
