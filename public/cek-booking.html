<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cek Booking — Wisuda Photography</title>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.15.x/dist/cdn.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=DM+Sans:opsz,wght@9..40,300..700&display=swap" rel="stylesheet">
  <style>
    :root { --cream: #FAF6F0; --sage: #C5A880; --peach: #F5EBE0; --lavender: #E8D8C8; --neon-lime: #D4AF37; --ink: #111E35; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--ink); }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    .animate-fade-up { animation: fadeUp 0.5s ease-out both; }
    .loading-spinner { border: 3px solid #E8E4D8; border-top: 3px solid #D4AF37; border-radius: 50%; width: 28px; height: 28px; animation: spin 1s linear infinite; display: inline-block; }
    .bg-noise { background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E"); }
    .input-fancy { border: 1.5px solid #E8E4D8; border-radius: 14px; padding: 14px 16px; font-size: 15px; background: white; transition: border 0.2s, box-shadow 0.2s; width: 100%; }
    .input-fancy:focus { outline: none; border-color: var(--sage); box-shadow: 0 0 0 4px rgba(139,168,139,0.15); }
    .card { border-radius: 20px; background: white; border: 1.5px solid #E8E4D8; box-shadow: 0 2px 12px rgba(0,0,0,0.03); }
    .status-badge { border-radius: 100px; padding: 4px 12px; font-size: 10px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
    .timeline-dot::before { content: ''; position: absolute; left: 11px; top: 24px; width: 2px; height: calc(100% - 24px); background: #E8E4D8; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; } }
  </style>
</head>
<body class="min-h-screen bg-noise">
  <nav class="sticky top-0 z-50 bg-[#FAF6F0]/85 backdrop-blur-lg border-b border-[#E8E4D8]/60">
    <div class="max-w-lg mx-auto px-5 h-14 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2">
        <span class="w-6 h-6 rounded-md bg-[#111E35] flex items-center justify-center text-[8px] font-bold text-[#D4AF37]">W</span>
        <span class="text-xs font-semibold">wisuda<span class="text-[#C5A880]">.</span></span>
      </a>
      <span class="text-[10px] text-[#4A4A5A]/60 tracking-wide">🔍 Cek Booking</span>
    </div>
  </nav>

  <div x-data="cekBookingApp()" x-init="init()" class="max-w-lg mx-auto px-5 pt-6 pb-20">
    <!-- Hero -->
    <div class="text-center mb-8 animate-fade-up">
      <span class="inline-block px-3 py-1 bg-[#C5A880]/20 rounded-full text-[10px] font-medium text-[#4A4A5A] mb-3">🔍 Tracking</span>
      <h1 class="text-2xl font-bold tracking-tight">Cek Status <span class="text-[#C5A880]">Booking</span></h1>
      <p class="text-sm text-[#4A4A5A]/70 mt-1">Masukin ID atau nama kamu ya 😉</p>
    </div>

    <!-- Search Form -->
    <div class="card p-4 mb-6 animate-fade-up">
      <div x-show="!hasSearched">
        <p class="text-xs text-[#4A4A5A]/60 mb-3">Masukin <strong>ID Booking</strong> atau <strong>Nama</strong> kamu yang didaftarin sebelumnya.</p>
      </div>
      <div class="flex gap-2">
        <input x-model="searchInput" @keydown.enter="searchBooking()" type="text" class="input-fancy !rounded-xl" placeholder="Cari ID / nama..."
          :disabled="searching">
        <button @click="searchBooking()" :disabled="searching || !searchInput.trim()"
          class="px-5 py-3 bg-[#111E35] text-[#D4AF37] rounded-xl text-xs font-semibold disabled:opacity-40 hover:bg-[#1C3B6F] transition flex items-center gap-1.5 flex-shrink-0">
          <span x-show="!searching">Cari</span>
          <span x-show="searching" class="loading-spinner !w-4 !h-4 !border-2"></span>
        </button>
      </div>
      <div x-show="error" class="mt-3 text-xs text-red-500 bg-red-50 rounded-xl px-3 py-2 border border-red-200" x-text="error"></div>
      <div x-show="noResult" class="mt-3 text-xs text-[#4A4A5A]/60 bg-[#FAF6F0] rounded-xl px-3 py-2">
        Booking gak ditemukan 😅 — mungkin beda nama atau ID? <button @click="searchInput=''; noResult=false" class="text-[#C5A880] underline">Coba lagi</button>
      </div>
    </div>

    <!-- Result -->
    <div x-show="booking" x-cloak class="animate-fade-up space-y-4">
      <!-- Status Header -->
      <div class="card overflow-hidden">
        <div :class="statusBg" class="px-5 py-3 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-white/20 flex items-center justify-center text-xl" x-text="statusIcon"></div>
            <div>
              <p class="text-sm font-semibold text-white" x-text="booking?.status_label"></p>
              <p class="text-[10px] text-white/70">ID: <span class="font-mono" x-text="booking?.id"></span></p>
            </div>
          </div>
          <span class="text-[10px] text-white/50" x-text="booking?.created_at_formatted"></span>
        </div>
        <div class="p-5 space-y-3 text-sm">
          <div class="flex justify-between"><span class="text-[#4A4A5A]/60">Client</span><span class="font-medium" x-text="booking?.client_name"></span></div>
          <div class="flex justify-between"><span class="text-[#4A4A5A]/60">Tanggal Wisuda</span><span x-text="booking?.graduation_date"></span></div>
        </div>
      </div>

      <!-- Timeline -->
      <div class="card p-5">
        <h3 class="text-xs font-semibold text-[#111E35] mb-4">📋 Timeline</h3>
        <div class="space-y-0">
          <template x-for="(ev, i) in timelineEvents" :key="i">
            <div class="relative pl-8 pb-5 timeline-dot">
              <div class="absolute left-0 top-0.5 w-6 h-6 rounded-full flex items-center justify-center text-xs" :class="ev.bg || (i === 0 ? 'bg-[#C5A880]/20' : 'bg-[#E8E4D8]')" x-text="ev.icon"></div>
              <div>
                <p class="text-sm font-medium text-[#111E35]" x-text="ev.title"></p>
                <p class="text-[10px] text-[#4A4A5A]/60" x-text="ev.date || ''"></p>
                <p x-show="ev.desc" class="text-xs text-[#4A4A5A]/70 mt-0.5" x-text="ev.desc"></p>
              </div>
            </div>
          </template>
          <div v-if="isActive" class="pl-8">
            <span class="inline-flex items-center gap-1.5 text-xs text-[#C5A880]">
              <span class="loading-spinner !w-3 !h-3 !border-2"></span> Live
            </span>
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div class="space-y-2.5">
        <a :href="booking?.wa_link_client" target="_blank"
          class="flex items-center justify-center gap-2 w-full px-5 py-3.5 bg-[#111E35] text-[#D4AF37] rounded-2xl font-semibold text-sm hover:bg-[#1C3B6F] transition shadow-sm">
          💬 Chat Admin via WA
        </a>
        <button @click="searchInput='';booking=null;noResult=false;hasSearched=false;error=''"
          class="w-full py-2.5 text-xs text-[#4A4A5A]/50 hover:text-[#4A4A5A] transition">
          Cari booking lain →
        </button>
      </div>
    </div>
  </div>

  <script>
    function cekBookingApp() {
      return {
        searchInput: '', booking: null, searching: false,
        error: '', noResult: false, hasSearched: false,

        get statusBg() {
          const s = this.booking?.status || ''
          if (s === 'confirmed' || s === 'dp_paid') return 'bg-gradient-to-r from-[#C5A880] to-[#95B895]'
          if (s === 'done' || s === 'completed') return 'bg-gradient-to-r from-[#111E35] to-[#1C3B6F]'
          if (s === 'cancelled') return 'bg-gradient-to-r from-red-400 to-red-500'
          return 'bg-gradient-to-r from-[#E8D8C8] to-[#D0C4E8]'
        },
        get statusIcon() {
          const s = this.booking?.status || ''
          if (s === 'pending') return '🕐'
          if (s === 'confirmed') return '✅'
          if (s === 'dp_paid') return '💰'
          if (s === 'done' || s === 'completed') return '🎓'
          if (s === 'cancelled') return '❌'
          return '📋'
        },

        get timelineEvents() {
          const b = this.booking
          if (!b) return []
          const events = []
          events.push({ icon: '🕐', title: 'Booking dibuat', date: b.created_at_formatted, desc: 'Tiket masuk antrean ✨', bg: 'bg-[#E8D8C8]/30' })
          if (b.status === 'confirmed' || b.status === 'dp_paid' || b.status === 'done' || b.status === 'completed')
            events.push({ icon: '✅', title: 'Dikonfirmasi Admin', desc: 'Tim kami siap ngurusin kamu 🫡' })
          if (b.status === 'dp_paid' || b.status === 'done' || b.status === 'completed')
            events.push({ icon: '💰', title: 'DP Lunas', desc: 'Gas booking aman 🔒' })
          if (b.status === 'done' || b.status === 'completed')
            events.push({ icon: '🎓', title: 'Foto Wisuda Selesai!', desc: 'Selamat! Tinggal tunggu hasil editan 🎉', bg: 'bg-[#D4AF37]/30' })
          if (b.status === 'cancelled')
            events.push({ icon: '❌', title: 'Booking dibatalkan', bg: 'bg-red-100' })
          return events
        },

        get isActive() {
          return !['done','completed','cancelled'].includes(this.booking?.status || '')
        },

        formatPrice(v) { return v ? 'Rp ' + Number(v).toLocaleString('id-ID') : 'Rp 0' },

        async searchBooking() {
          if (!this.searchInput.trim()) return
          this.searching = true
          this.error = ''
          this.noResult = false
          this.booking = null
          this.hasSearched = true
          try {
            const res = await fetch('/api/public/cek-booking?q=' + encodeURIComponent(this.searchInput.trim()))
            const data = await res.json()
            if (!res.ok) { this.error = data.error || 'Gagal cek'; this.searching = false; return }
            if (!data || !data.id) { this.noResult = true; this.searching = false; return }
            this.booking = data
          } catch(e) { this.error = 'Yah, error 😅 Coba lagi.'; console.error('Cek booking:', e) }
          this.searching = false
        },
        init() {
          // Auto-search from URL param
          const url = new URL(window.location.href)
          const q = url.searchParams.get('id') || url.searchParams.get('q')
          if (q) { this.searchInput = q; this.searchBooking() }
        }
      }
    }
  </script>
</body>
</html>
