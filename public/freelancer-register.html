<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pendaftaran Partner Freelance</title>
  <link id="dynamic-favicon" rel="icon" type="image/png" href="/favicon.png">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.15.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="/css/tailwind.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    .serif-title {
      font-family: 'Cormorant Garamond', serif;
    }
    .glass-card {
      background: rgba(26, 26, 46, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(197, 155, 99, 0.15);
    }
    .input-fancy {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(197, 155, 99, 0.15);
      border-radius: 12px;
      color: #FAF9F6;
      transition: all 0.3s ease;
    }
    .input-fancy:focus {
      border-color: #C59B63;
      box-shadow: 0 0 0 3px rgba(197, 155, 99, 0.25);
      background: rgba(255, 255, 255, 0.06);
      outline: none;
    }
    .input-fancy::placeholder {
      color: rgba(138, 122, 114, 0.6);
    }
    .checkbox-fancy {
      appearance: none;
      width: 18px;
      height: 18px;
      border: 1.5px solid rgba(197, 155, 99, 0.4);
      border-radius: 4px;
      outline: none;
      cursor: pointer;
      position: relative;
      transition: all 0.2s ease;
    }
    .checkbox-fancy:checked {
      background-color: #C59B63;
      border-color: #C59B63;
    }
    .checkbox-fancy:checked::after {
      content: '✓';
      position: absolute;
      color: #1A1A2E;
      font-size: 11px;
      font-weight: bold;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
  </style>
</head>
<body class="bg-[#0B0B14] text-[#FAF9F6] min-h-screen flex items-center justify-center p-4 relative overflow-y-auto">
  
  <!-- Backlight effect -->
  <div class="absolute w-[400px] h-[400px] rounded-full bg-[#C59B63]/5 blur-[120px] top-1/4 left-1/4 pointer-events-none"></div>
  <div class="absolute w-[350px] h-[350px] rounded-full bg-[#1e293b]/20 blur-[100px] bottom-1/4 right-1/4 pointer-events-none"></div>

  <div x-data="recruitmentApp()" x-init="init()" class="w-full max-w-lg relative z-10 py-8">
    <!-- Header -->
    <div class="text-center mb-8">
      <h1 class="serif-title text-4xl md:text-5xl font-semibold text-[#C59B63] tracking-wide mb-2">Join as Partner</h1>
      <p class="text-xs text-[#8A7A72] tracking-wider uppercase font-light">Pendaftaran Tim Dokumentasi Wisuda</p>
    </div>

    <!-- Alert Banner -->
    <div x-show="error || success" x-transition class="mb-6">
      <div class="p-4 rounded-xl border text-sm" 
        :class="error ? 'bg-red-950/40 border-red-500/30 text-red-300' : 'bg-emerald-950/40 border-emerald-500/30 text-emerald-300'"
        x-text="error || success"></div>
    </div>

    <!-- Form Glass Card -->
    <div class="glass-card rounded-3xl p-6 md:p-8 shadow-2xl relative" x-show="!submitted">
      <form @submit.prevent="submitForm()" class="space-y-5">
        <!-- Nama -->
        <div class="space-y-1.5">
          <label class="block text-xs font-semibold text-[#C59B63] uppercase tracking-wider">Nama Lengkap</label>
          <input x-model="form.name" type="text" required class="w-full px-4 py-3 input-fancy text-sm" placeholder="Masukkan nama lengkap Anda">
        </div>

        <!-- No WA -->
        <div class="space-y-1.5">
          <label class="block text-xs font-semibold text-[#C59B63] uppercase tracking-wider">No. WhatsApp</label>
          <div class="flex">
            <span class="flex items-center px-4 bg-white/5 border border-r-0 border-[#C59B63]/25 rounded-l-xl text-sm text-[#8A7A72]">+62</span>
            <input x-model="phoneDisplay" @input="formatPhone()" type="tel" required class="w-full px-4 py-3 input-fancy rounded-l-none text-sm" placeholder="8123456789">
          </div>
        </div>

        <!-- Email -->
        <div class="space-y-1.5">
          <label class="block text-xs font-semibold text-[#C59B63] uppercase tracking-wider">Email (Opsional)</label>
          <input x-model="form.email" type="email" class="w-full px-4 py-3 input-fancy text-sm" placeholder="nama@email.com">
        </div>

        <!-- Domisili Kota -->
        <div class="space-y-1.5">
          <label class="block text-xs font-semibold text-[#C59B63] uppercase tracking-wider">Domisili Operasional (Kota)</label>
          <select x-model="form.city" required class="w-full px-4 py-3 input-fancy text-sm bg-[#1A1A2E]">
            <option value="" disabled class="text-slate-600">Pilih kota domisili Anda...</option>
            <template x-for="city in supportedCities" :key="city">
              <option :value="city" x-text="city" class="text-white bg-[#1A1A2E]"></option>
            </template>
          </select>
        </div>

        <!-- Spesialisasi / Role (Multiselect Checkboxes) -->
        <div class="space-y-2">
          <label class="block text-xs font-semibold text-[#C59B63] uppercase tracking-wider">Spesialisasi / Role</label>
          <div class="grid grid-cols-3 gap-3">
            <template x-for="role in rolesList" :key="role">
              <label class="flex items-center gap-2 p-3 bg-white/5 border border-[#C59B63]/10 rounded-xl cursor-pointer hover:bg-white/10 transition text-xs">
                <input type="checkbox" :value="role" x-model="form.specialties" class="checkbox-fancy">
                <span x-text="role" class="font-medium text-[#FAF9F6]"></span>
              </label>
            </template>
          </div>
        </div>

        <!-- Link Portfolio -->
        <div class="space-y-1.5">
          <label class="block text-xs font-semibold text-[#C59B63] uppercase tracking-wider">Link Portofolio (G-Drive / Website / IG)</label>
          <input x-model="form.portfolio_url" type="url" required class="w-full px-4 py-3 input-fancy text-sm" placeholder="https://drive.google.com/drive/folders/...">
        </div>

        <!-- Keterangan Gear / Alat -->
        <div class="space-y-1.5">
          <label class="block text-xs font-semibold text-[#C59B63] uppercase tracking-wider">Spesifikasi Gear & Alat (Kamera, Lensa, Laptop)</label>
          <textarea x-model="form.gear_info" rows="3" class="w-full px-4 py-3 input-fancy text-sm resize-none" placeholder="Contoh: Sony A7III, Lensa 50mm f/1.8, Macbook Pro M1..."></textarea>
        </div>

        <!-- Submit Button -->
        <button type="submit" :disabled="submitting" 
          class="w-full py-3.5 bg-gradient-to-r from-[#C59B63] to-[#B89050] text-[#1A1A2E] rounded-xl font-bold text-sm tracking-wider uppercase disabled:opacity-40 hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2 shadow-lg shadow-[#C59B63]/15">
          <template x-if="submitting">
            <span class="w-4 h-4 border-2 border-[#1A1A2E] border-t-transparent rounded-full animate-spin"></span>
          </template>
          <span x-text="submitting ? 'Mengirim...' : 'Kirim Pendaftaran'"></span>
        </button>
      </form>
    </div>

    <!-- Success Screen -->
    <div class="glass-card rounded-3xl p-8 text-center shadow-2xl relative space-y-5" x-show="submitted">
      <div class="w-16 h-16 bg-[#C59B63]/10 border border-[#C59B63]/30 rounded-full flex items-center justify-center mx-auto text-3xl">🎉</div>
      <h2 class="serif-title text-3xl font-semibold text-[#C59B63]">Pendaftaran Berhasil!</h2>
      <p class="text-sm text-[#8A7A72] leading-relaxed max-w-sm mx-auto">
        Terima kasih atas minat Anda bergabung sebagai partner kami. Tim admin kami akan meninjau portofolio Anda dan mengonfirmasi hasil keputusan melalui nomor WhatsApp yang terdaftar.
      </p>
      <div class="pt-2">
        <a href="/" class="inline-block px-6 py-2.5 bg-[#FAF9F6]/5 border border-[#C59B63]/25 hover:bg-[#FAF9F6]/10 text-xs font-semibold rounded-xl text-[#C59B63] transition">Kembali ke Beranda</a>
      </div>
    </div>
  </div>

  <!-- Developer Watermark -->
  <script src="/js/watermark.js" defer></script>

  <script>
    function recruitmentApp() {
      return {
        form: {
          name: '',
          phone: '',
          email: '',
          portfolio_url: '',
          specialties: [],
          city: '',
          gear_info: ''
        },
        phoneDisplay: '',
        supportedCities: ['Makassar', 'Jakarta', 'Surabaya', 'Yogyakarta', 'Bandung'], // Fallback
        rolesList: ['Photographer', 'Videographer', 'Editor'],
        submitting: false,
        submitted: false,
        error: '',
        success: '',

        async init() {
          try {
            // Load supported cities dynamically from settings API
            const res = await fetch('/api/public/settings');
            if (res.ok) {
              const data = await res.json();
              if (data.supported_cities) {
                this.supportedCities = data.supported_cities;
              }
              const favUrl = data.favicon_url || data.logo_url;
              if (favUrl) {
                document.querySelectorAll("link[rel*='icon']").forEach(l => l.href = favUrl);
              }
            }
          } catch (e) {
            console.error('Failed to load supported cities settings:', e);
          }
        },

        formatPhone() {
          // Remove non-digit characters
          let raw = this.phoneDisplay.replace(/[^0-9]/g, '');
          if (raw.startsWith('62')) {
            raw = raw.slice(2);
          } else if (raw.startsWith('0')) {
            raw = raw.slice(1);
          }
          this.phoneDisplay = raw;
          this.form.phone = '62' + raw;
        },

        async submitForm() {
          if (this.form.specialties.length === 0) {
            this.error = 'Harap pilih minimal 1 spesialisasi/role kerja.';
            return;
          }
          this.submitting = true;
          this.error = '';
          this.success = '';

          try {
            const res = await fetch('/api/public/recruitment/apply', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              },
              body: JSON.stringify(this.form)
            });
            const data = await res.json();

            if (res.ok) {
              this.success = data.message || 'Pendaftaran berhasil dikirim!';
              this.submitted = true;
            } else {
              this.error = data.error || 'Gagal mengirim pendaftaran.';
            }
          } catch (e) {
            this.error = 'Kesalahan jaringan. Harap periksa koneksi Anda dan coba lagi.';
          } finally {
            this.submitting = false;
          }
        }
      }
    }
  </script>
</body>
</html>
